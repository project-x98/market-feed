# Market feed: updates market.json with stock, bond, Bitcoin and home prices.
# Put this file in a PUBLIC repo named "market-feed" at .github/workflows/update-market.yml
# Public repos run GitHub Actions for free (does not use your private-repo minutes).
name: Update market prices

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch: {}      # or run it by hand from the Actions tab

permissions:
  contents: write
  
concurrency:
  group: market-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prices
        run: |
          cat > update_market.py <<'PY'
          # Collects public market prices and writes market.json.
          # Keyless sources; each value falls back to the previous day's value if a source fails.
          import csv, datetime, io, json, os, urllib.request

          UA = {"User-Agent": "Mozilla/5.0 (market-feed)"}

          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.read().decode("utf-8", "replace")

          def yahoo(sym):
              j = json.loads(get(f"https://query1.finance.yahoo.com/v8/finance/chart/{sym}?range=5d&interval=1d"))
              return float(j["chart"]["result"][0]["meta"]["regularMarketPrice"])

          def stooq(sym):
              rows = list(csv.DictReader(io.StringIO(get(f"https://stooq.com/q/l/?s={sym}&f=sd2t2ohlcv&h&e=csv"))))
              return float(rows[0]["Close"])

          def coinbase_btc():
              return float(json.loads(get("https://api.coinbase.com/v2/prices/BTC-USD/spot"))["data"]["amount"])

          def treasury_10y():
              year = datetime.date.today().year
              text = get("https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/"
                         f"{year}/all?type=daily_treasury_yield_curve&field_tdr_date_value={year}&page&_format=csv")
              rows = list(csv.DictReader(io.StringIO(text)))
              return float(rows[0]["10 Yr"])  # newest first, in percent

          def fred_last(series):
              rows = [r for r in csv.reader(io.StringIO(get(f"https://fred.stlouisfed.org/graph/fredgraph.csv?id={series}")))][1:]
              rows = [r for r in rows if len(r) == 2 and r[1] not in ("", ".")]
              return float(rows[-1][1]), rows[-1][0]

          def first(*fns):
              for fn in fns:
                  try:
                      v = fn()
                      if v and v > 0:
                          return v
                  except Exception as e:
                      print("source failed:", getattr(fn, "__name__", fn), e)
              return None

          old = {}
          if os.path.exists("market.json"):
              try:
                  old = json.load(open("market.json"))
              except Exception:
                  old = {}

          out = dict(old)
          vals = {
              "voo": first(lambda: yahoo("VOO"), lambda: stooq("voo.us")),
              "sp500": first(lambda: yahoo("%5EGSPC"), lambda: stooq("%5Espx")),
              "btc": first(coinbase_btc, lambda: yahoo("BTC-USD")),
              "t10": first(treasury_10y, lambda: yahoo("%5ETNX")),
          }
          for k, v in vals.items():
              if v is not None:
                  out[k] = round(v, 4)
          try:
              home, home_date = fred_last("MSPUS")  # Census median sales price of houses sold (quarterly)
              out["home"], out["home_date"] = home, home_date
          except Exception as e:
              print("home failed:", e)

          out["updated"] = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")
          json.dump(out, open("market.json", "w"), indent=2)
          print(json.dumps(out, indent=2))
          PY
          python3 update_market.py
          rm update_market.py
      - name: Save market.json
        run: |
          git config user.name "market-feed-bot"
          git config user.email "market-feed-bot@users.noreply.github.com"
          git add market.json
          git diff --cached --quiet || git commit -m "Update market prices"
          git pull --rebase -X theirs origin main && git push
